# Sestaví APK po každém pushi do main a dá ho do vydání (Releases) na GitHubu.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["tools/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Sestavení
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'pekeyVersionName = "\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          OUT="Pekey-keyboard-$VER.apk"
          cp "$APK" "$OUT"
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" --title "Pekey keyboard $VER" --notes "Sestaveno z ${GITHUB_SHA::7}."
          fi
