# Sestaví APK po každém pushi do main a dá ho do vydání (Releases) na GitHubu.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["tools/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Zdroj whisper.cpp (hlasové zadávání)
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp
          git -C app/src/main/cpp/whisper.cpp checkout aba02defd6bb6ff5de63721c21e3456645c153e2

      - name: Sestavení
        run: |
          # předinstalované NDK na stroji GitHubu (bez stahování)
          export PEKEY_NDK=$(basename "$ANDROID_NDK_LATEST_HOME")
          echo "NDK: $PEKEY_NDK"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Kontrola, že APK nemá přístup k síti
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -E "INTERNET|NETWORK_STATE|WIFI_STATE" perms.txt; then
            echo "::error::APK obsahuje síťové oprávnění"
            exit 1
          fi

      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'pekeyVersionName = "\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          OUT="Pekey-keyboard-$VER.apk"
          cp "$APK" "$OUT"
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" --title "Pekey keyboard $VER" --notes "Sestaveno z ${GITHUB_SHA::7}."
          fi
